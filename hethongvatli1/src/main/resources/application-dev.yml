# Development profile: PostgreSQL (Local or Cloud via Environment Variables)
spring:
  config:
    import:
      - "optional:classpath:application-local.yml"
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vatly1}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  tomcat:
    max-wait: 20000
    max-active: 50
    max-idle: 20
    min-idle: 15
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        id:
          new_generator_mappings: false

server:
  port: ${SERVER_PORT:8080}
