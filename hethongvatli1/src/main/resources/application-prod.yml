spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  task:
    execution:
      pool:
        core-size: 10
        max-size: 50
  lifecycle:
    timeout-per-shutdown-phase: 30s

security:
  jwt:
    token:
      secret-key: ${JWT_SECRET}
      expire-length: ${JWT_EXPIRE_MS:900000}
    refresh-token:
      expire-length: ${JWT_REFRESH_EXPIRE_MS:604800000}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

scheduling:
  enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  file:
    upload-dir: ${FILE_UPLOAD_DIR:/app/uploads}
    max-size-mb: ${FILE_MAX_SIZE_MB:50}

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME:vatly1-bucket}
  url-prefix: ${MINIO_URL_PREFIX:http://localhost:9000/vatly1-bucket}
  enabled: ${MINIO_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    app:
      name: vatly1-auth
      version: 1.0.0
      description: He thong Hoc phan Vat ly 1
