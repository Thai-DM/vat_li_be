spring:
  profiles:
    active: dev

security:
  jwt:
    token:
      # For production, set JWT_SECRET (and optionally JWT_EXPIRE_MS) via environment variables. Do not use the default in production.
      secret-key: ${JWT_SECRET:secret-key}
      expire-length: ${JWT_EXPIRE_MS:300000} # 5 minutes default; override with JWT_EXPIRE_MS (milliseconds)
    refresh-token:
      expire-length: ${JWT_REFRESH_EXPIRE_MS:604800000} # 7 days default; override with JWT_REFRESH_EXPIRE_MS (milliseconds)

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  file:
    upload-dir: ${FILE_UPLOAD_DIR:uploads}
    max-size-mb: ${FILE_MAX_SIZE_MB:50}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:vatly1-bucket}
  url-prefix: ${MINIO_URL_PREFIX:http://localhost:9000/vatly1-bucket}
  enabled: ${MINIO_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    app:
      name: vatly1-auth
      version: 1.0.0
      description: He thong Hoc phan Vat ly 1
