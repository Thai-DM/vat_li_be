version: '3.8'
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://db:5432/vatly1
      - DATABASE_USERNAME=vatly1
      - DATABASE_PASSWORD=vatly1_pass
      - JWT_SECRET=your-secret-key-change-in-production-at-least-32-chars
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=vatly1
      - POSTGRES_USER=vatly1
      - POSTGRES_PASSWORD=vatly1_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vatly1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
